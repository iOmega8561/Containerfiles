[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/fd/1
logfile_maxbytes=0

[program:podman-unix]
priority=0
command=/usr/bin/podman system service --time=0 unix:///run/user/1000/podman.sock
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:podman-tcp]
priority=1
command=/usr/bin/podman system service --time=0 tcp://0.0.0.0:2375
autostart=%(ENV_ENABLE_TCP)s
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:sshd]
priority=2
command=/usr/sbin/sshd -De -p 2222
    -o HostKey=/opt/sshd/ssh_host_ed25519_key
    -o PidFile=/tmp/sshd.pid
    -o UsePAM=no
    -o PermitRootLogin=no
    -o PasswordAuthentication=no
    -o PermitEmptyPasswords=no
    -o KbdInteractiveAuthentication=no
    -o PubkeyAuthentication=yes
    -o AuthenticationMethods=publickey
    -o X11Forwarding=no
    -o AllowUsers=podman
autostart=%(ENV_ENABLE_SSH)s
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true