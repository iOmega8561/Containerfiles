# Unbound configuration for the rootless, read-only Quadlet deployment.
# Mounted read-only over the stock /etc/unbound/unbound.conf.

server:
    # Run in the foreground as the unprivileged user the container
    # already starts as: no chroot, no privilege drop, no PID file.
    do-daemonize: no
    username: ""
    chroot: ""
    pidfile: ""

    # Log to stderr, where Podman and journald collect it.
    use-syslog: no
    logfile: ""
    verbosity: 1
    log-servfail: yes

    # Listen on every interface of the container's own network namespace.
    # Exposure is decided by PublishPort= in unbound.container.
    interface: 0.0.0.0
    interface: ::0
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # Answer loopback and private networks only.
    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    access-control: fc00::/7 allow
    access-control: fe80::/10 allow

    # DNSSEC with the static root anchor shipped by dnssec-root. The image
    # is rebuilt monthly, so the anchor follows the package rather than
    # being rewritten at runtime (RFC 5011 needs a writable file).
    trust-anchor-file: "/usr/share/dnssec-root/trusted-key.key"
    val-log-level: 1

    # Hardening and privacy.
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: no
    harden-algo-downgrade: no
    qname-minimisation: yes
    aggressive-nsec: yes
    use-caps-for-id: no
    unwanted-reply-threshold: 10000000
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    # Cache; everything lives in memory, nothing is written to disk.
    num-threads: 2
    msg-cache-size: 32m
    rrset-cache-size: 64m
    prefetch: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    so-reuseport: yes
    edns-buffer-size: 1232

remote-control:
    # The control socket would need a writable /run; use
    # `podman restart unbound` instead of unbound-control.
    control-enable: no
