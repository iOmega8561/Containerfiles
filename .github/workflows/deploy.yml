name: deploy

on:
  schedule:
    - cron: '0 0 1 * *'  # 1st of every month at midnight UTC
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          SERVICES=$(jq -c '.services' .github/workflows/deploy.json)
          echo "services=$SERVICES" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push using Podman
        run: |
          ACTOR=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$ACTOR/${{ matrix.service }}
          LONG_SHA=${{ github.sha }}
          SHORT_SHA="${LONG_SHA:0:7}"

          podman build \
            --build-arg REPO_URL="${{ github.server_url }}/${{ github.repository }}" \
            --build-arg REVISION="$LONG_SHA" \
            -t $IMAGE:$SHORT_SHA \
            -t $IMAGE:latest \
            ${{ matrix.service }} --file Containerfile

          podman push $IMAGE:$SHORT_SHA
          podman push $IMAGE:latest
